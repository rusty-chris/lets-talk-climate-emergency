name: CI

# Stages match IMPLEMENTATION.md §6: lint -> unit -> integration -> smoke,
# all four running unconditionally on every PR push and all blocking merge
# (review finding #28 removed an earlier, unsanctioned label gate on the
# integration and smoke jobs). `full eval suite` and `scheduled`
# (IMPLEMENTATION.md §6) are release-time jobs added by #21 and are out of
# scope here.

on:
  pull_request:
  # Every push to main (i.e. every merge commit) is tested too: two PRs can
  # each be green in isolation yet semantically incompatible after merging,
  # and GitHub merge commits are trees PR CI never saw (finding #29). A red
  # run on main is a stop-the-line event before cutting the next branch.
  push:
    branches: [main]
  workflow_dispatch:

env:
  UV_VERSION: "0.11.28"
  # ADR-005 / issue #9 / finding #163: the pinned local embedding model AND
  # its pinned hub revision (full commit hash — must match
  # rag.indexing.BGE_M3_REVISION). The keyed cache below is invalidated
  # automatically if either ever changes, so a revision bump re-fetches
  # instead of silently serving old cached weights under the new pin.
  BGE_M3_MODEL_ID: "BAAI/bge-m3"
  BGE_M3_REVISION: "5617a9f61b028005a4858fdac845db406aefb181"
  # ADR-006 / issue #11 / finding #178: the pinned local cross-encoder
  # reranker AND its pinned hub revision (full commit hash — must match
  # rag.retrieval.BGE_RERANKER_REVISION). Cached alongside bge-m3 so the
  # integration reranker smoke downloads once; the cache key includes the
  # revision so a pin bump re-fetches instead of serving the old cache.
  BGE_RERANKER_MODEL_ID: "BAAI/bge-reranker-v2-m3"
  BGE_RERANKER_REVISION: "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e"

jobs:
  lint:
    name: lint (ruff + pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files

  unit:
    name: unit (pytest, unmarked)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # --extra parse: the ingestion parse backends (docling/pymupdf) live
      # outside the base deps (#125) so the unit tier needs the extra to
      # keep exercising them.
      - run: uv sync --locked --extra parse
      - run: uv run pytest

  integration:
    name: integration (pytest -m integration)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # --extra parse: the ingestion parse backends (docling/pymupdf) live
      # outside the base deps (#125) so the integration tier needs the
      # extra to keep exercising them.
      - run: uv sync --locked --extra parse
      # The real-model integration checks need the pinned local weights
      # available: test_bge_m3_smoke.py (issue #9, ~2GB bge-m3, pinned to
      # the exact hub revision — finding #163) and test_reranker_smoke.py
      # (issue #11, ~2GB bge-reranker-v2-m3) — tests/_weights.py FAILS the
      # job rather than silently skip when CI=true and they're missing (the
      # #32 convention). One Hugging Face hub cache, keyed on BOTH pinned
      # model ids AND the bge-m3 revision pin, so the download happens once,
      # not on every PR push; a cache miss re-fetches (bge-m3 at exactly the
      # pinned revision) and a cache hit costs one filesystem check (no
      # network). Including the revision in the key means bumping the pin
      # can never silently keep serving the previous revision's warm cache.
      - name: Cache local model weights (Hugging Face hub cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-weights-${{ env.BGE_M3_MODEL_ID }}-${{ env.BGE_M3_REVISION }}-${{ env.BGE_RERANKER_MODEL_ID }}-${{ env.BGE_RERANKER_REVISION }}-v1
      - name: Fetch local model weights (skips on a cache hit)
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          hub = Path.home() / ".cache/huggingface/hub"
          # (model id, pinned revision). Both local models are
          # revision-pinned (findings #163/#178): only that exact
          # snapshot counts as cached.
          targets = [
              ("${{ env.BGE_M3_MODEL_ID }}", "${{ env.BGE_M3_REVISION }}"),
              ("${{ env.BGE_RERANKER_MODEL_ID }}", "${{ env.BGE_RERANKER_REVISION }}"),
          ]
          for model_id, revision in targets:
              snapshots = hub / f"models--{model_id.replace('/', '--')}" / "snapshots"
              if revision is not None:
                  pinned = snapshots / revision
                  cached = pinned.is_dir() and any(pinned.iterdir())
              else:
                  cached = snapshots.is_dir() and any(
                      p.is_dir() and any(p.iterdir()) for p in snapshots.iterdir()
                  )
              label = f"{model_id}@{revision}" if revision else model_id
              if cached:
                  print(f"{label} already cached — skipping download")
              else:
                  from huggingface_hub import snapshot_download

                  print(f"{label} not cached — downloading (first run only)")
                  snapshot_download(model_id, revision=revision)
          PY
      # `and not live` so a mismarked live test can never make real API
      # calls in a per-PR job (IMPLEMENTATION.md §4, finding #31).
      - run: uv run pytest -m "integration and not live"
      # Review finding #176: 'recording evidence every run' must survive
      # the run — the perf-marked rerank latency test appends to the
      # repo-level perf log (evals/perf/, or CLIMATE_CHAT_PERF_LOG), and
      # this step keeps it as a build artifact even when the job fails.
      - name: Upload rerank perf log (evidence every run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rerank-perf-log
          path: evals/perf/*.csv
          if-no-files-found: ignore

  smoke:
    name: smoke (docker compose up + health checks)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      # `and not live` so a mismarked live test can never make real API
      # calls in a per-PR job (IMPLEMENTATION.md §4, finding #31).
      - run: uv run pytest -m "smoke and not live"
