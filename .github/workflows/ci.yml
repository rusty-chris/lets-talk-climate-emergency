name: CI

# Stages match IMPLEMENTATION.md §6: lint -> unit -> integration -> smoke,
# all four running unconditionally on every PR push and all blocking merge
# (review finding #28 removed an earlier, unsanctioned label gate on the
# integration and smoke jobs). `full eval suite` and `scheduled`
# (IMPLEMENTATION.md §6) are release-time jobs added by #21 and are out of
# scope here.

on:
  pull_request:
  # Every push to main (i.e. every merge commit) is tested too: two PRs can
  # each be green in isolation yet semantically incompatible after merging,
  # and GitHub merge commits are trees PR CI never saw (finding #29). A red
  # run on main is a stop-the-line event before cutting the next branch.
  push:
    branches: [main]
  workflow_dispatch:

env:
  UV_VERSION: "0.11.28"
  # ADR-005 / issue #9: the pinned local embedding model. Keyed cache below
  # is invalidated automatically if this ever changes.
  BGE_M3_MODEL_ID: "BAAI/bge-m3"
  # ADR-006 / issue #11: the pinned local cross-encoder reranker. Cached
  # alongside bge-m3 so the integration reranker smoke downloads once.
  BGE_RERANKER_MODEL_ID: "BAAI/bge-reranker-v2-m3"

jobs:
  lint:
    name: lint (ruff + pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files

  unit:
    name: unit (pytest, unmarked)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  integration:
    name: integration (pytest -m integration)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      # The real-model integration checks need the pinned local weights
      # available: test_bge_m3_smoke.py (issue #9, ~2GB bge-m3) and
      # test_reranker_smoke.py (issue #11, ~2GB bge-reranker-v2-m3) —
      # tests/_weights.py FAILS the job rather than silently skip when
      # CI=true and they're missing (the #32 convention). One Hugging Face
      # hub cache, keyed on BOTH pinned model ids, so the download happens
      # once, not on every PR push; a cache miss re-fetches and a cache hit
      # costs one filesystem check (no network).
      - name: Cache local model weights (Hugging Face hub cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-weights-${{ env.BGE_M3_MODEL_ID }}-${{ env.BGE_RERANKER_MODEL_ID }}-v1
      - name: Fetch local model weights (skips on a cache hit)
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          model_ids = ["${{ env.BGE_M3_MODEL_ID }}", "${{ env.BGE_RERANKER_MODEL_ID }}"]
          for model_id in model_ids:
              snapshots = (
                  Path.home() / ".cache/huggingface/hub"
                  / f"models--{model_id.replace('/', '--')}" / "snapshots"
              )
              cached = snapshots.is_dir() and any(
                  p.is_dir() and any(p.iterdir()) for p in snapshots.iterdir()
              )
              if cached:
                  print(f"{model_id} already cached — skipping download")
              else:
                  from huggingface_hub import snapshot_download

                  print(f"{model_id} not cached — downloading (first run only)")
                  snapshot_download(model_id)
          PY
      # `and not live` so a mismarked live test can never make real API
      # calls in a per-PR job (IMPLEMENTATION.md §4, finding #31).
      - run: uv run pytest -m "integration and not live"

  smoke:
    name: smoke (docker compose up + health checks)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      # `and not live` so a mismarked live test can never make real API
      # calls in a per-PR job (IMPLEMENTATION.md §4, finding #31).
      - run: uv run pytest -m "smoke and not live"
