services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # --no-access-log: uvicorn's default access log writes the raw client
    # IP (client_addr) to stdout on every request, which the platform log
    # store retains — a DESIGN §9 "no user identifiers" violation (#212);
    # the app's hashed rate-limit records are the sanctioned telemetry.
    # --no-proxy-headers: X-Forwarded-For trust is decided ONLY by
    # service.rate_limit.resolve_client_ip / CLIMATE_CHAT_TRUSTED_PROXY,
    # never by uvicorn rewriting request.client behind the app's back.
    command: ["uvicorn", "service.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--no-proxy-headers"]
    # Issue #22: the api reads the CLIMATE_CHAT_* config + ANTHROPIC_API_KEY
    # from the environment (service.config.load_service_config). Each value
    # passes through from the host with a dev-safe default so a plain
    # `docker compose up` (tests/smoke/test_healthchecks.py) boots, while a
    # real deploy overrides them (see service/DEPLOYMENT.md). The default
    # starter cache is the committed synthetic dev cache; the default budget
    # keeps a bare dev stack live, and the cut-off smoke test overrides the
    # budget to 0 to force the paused read-only state.
    # Single-`$` interpolation is intentional here (host substitution with a
    # default) — unlike the `$$`-escaped qdrant healthcheck script below,
    # which must reach the container literally.
    environment:
      CLIMATE_CHAT_DAILY_BUDGET_USD: "${CLIMATE_CHAT_DAILY_BUDGET_USD:-5.00}"
      CLIMATE_CHAT_OPUS_SUBCAP_USD: "${CLIMATE_CHAT_OPUS_SUBCAP_USD:-1.00}"
      CLIMATE_CHAT_CORPUS_VERSION: "${CLIMATE_CHAT_CORPUS_VERSION:-dev-corpus-0000}"
      CLIMATE_CHAT_CORPUS_VINTAGE: "${CLIMATE_CHAT_CORPUS_VINTAGE:-2026-08-01}"
      CLIMATE_CHAT_SITE_URL: "${CLIMATE_CHAT_SITE_URL:-http://localhost:8000}"
      CLIMATE_CHAT_QDRANT_URL: "${CLIMATE_CHAT_QDRANT_URL:-http://qdrant:6333}"
      CLIMATE_CHAT_STARTER_CACHE_DIR: "${CLIMATE_CHAT_STARTER_CACHE_DIR:-/app/service/dev_starter_cache}"
      CLIMATE_CHAT_LOG_DIR: "${CLIMATE_CHAT_LOG_DIR:-/tmp/climate-chat-logs}"
      # Dev/compose default (a real deploy sets its own). Comfortably above
      # the smoke tier's burst: the paused-coverage suite fires all 13 §7.1
      # starter questions plus a free-text question against one stack from a
      # single host IP in one run (finding #231) — a 10/min default would
      # 429 the loop. Per-IP limiting is a secondary layer here; the hard
      # daily budget is the backstop (DECISIONS §rate-limit).
      CLIMATE_CHAT_RATE_LIMIT_PER_MINUTE: "${CLIMATE_CHAT_RATE_LIMIT_PER_MINUTE:-60}"
      CLIMATE_CHAT_BEST_MODE: "${CLIMATE_CHAT_BEST_MODE:-0}"
      CLIMATE_CHAT_TRUSTED_PROXY: "${CLIMATE_CHAT_TRUSTED_PROXY:-0}"
      # The composition-root provider switch (finding #231): default live
      # Anthropic, or 'replay' over checked-in fixtures for the live-path
      # smoke tier. Passed through so the smoke suite can pin the api to the
      # ReplayAdapter (CLIMATE_CHAT_REPLAY_DIR names the in-container path).
      CLIMATE_CHAT_PROVIDER: "${CLIMATE_CHAT_PROVIDER:-anthropic}"
      CLIMATE_CHAT_REPLAY_DIR: "${CLIMATE_CHAT_REPLAY_DIR:-}"
      # Deployment artifacts (issues #214/#216). The dev/compose defaults
      # point at the committed SYNTHETIC smoke fixtures baked into the image
      # — readable at boot when the smoke-seeder has ingested an index
      # (finding #231), inert (never consulted) in the index-less dev/paused
      # stacks. A real deploy overrides all three with its release artifacts.
      CLIMATE_CHAT_THRESHOLD_ARTIFACT: "${CLIMATE_CHAT_THRESHOLD_ARTIFACT:-/app/tests/fixtures/smoke/threshold.json}"
      CLIMATE_CHAT_DATASET_MANIFEST: "${CLIMATE_CHAT_DATASET_MANIFEST:-/app/tests/fixtures/smoke/dataset_manifest.yaml}"
      CLIMATE_CHAT_CHART_PACK_DIR: "${CLIMATE_CHAT_CHART_PACK_DIR:-/app/tests/fixtures/smoke/pack}"
      # Presence-checked only; never stored on config or logged. The dev
      # default is NOT a real key — any live call would fail auth loudly.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-dev-placeholder-not-a-real-key}"
    # All ports loopback-only (finding #36): unprefixed bindings publish on
    # 0.0.0.0 and Docker bypasses host firewalls on Linux. Deployment (#22)
    # overrides deliberately for its own ingress.
    ports:
      - "127.0.0.1:8000:8000"
    # Persist the log dir (exchange log, chart-spec store, and the #217
    # per-UTC-day spend journal under spend-state/) so a container restart
    # or crash-loop cannot forget the day's spend and un-pause the cap. The
    # mount path matches the CLIMATE_CHAT_LOG_DIR default above.
    # replay_fixtures: the shared volume the smoke-seeder generates the
    # ReplayAdapter fixtures into (finding #231) — mounted at the exact
    # in-container path the replay smoke pins as CLIMATE_CHAT_REPLAY_DIR.
    # The model-weights cache is shared with the seeder so the retrieval
    # models load from one download (CI binds the runner's populated
    # ~/.cache/huggingface via SMOKE_HF_CACHE).
    volumes:
      - api_data:/tmp/climate-chat-logs
      - replay_fixtures:/app/tests/fixtures/replay/starter_smoke
      - "${SMOKE_HF_CACHE:-hf_model_cache}:/root/.cache/huggingface"
    # The api boots only after the one-shot seeder finished (a no-op exit in
    # every stack except the replay smoke), so a seeded index and the replay
    # fixtures are in place before the boot-time version/artifact checks run.
    depends_on:
      qdrant:
        condition: service_healthy
      smoke-seeder:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot seeder for the replay-composed smoke stack (finding #231):
  # inert (exits 0 in milliseconds) unless CLIMATE_CHAT_PROVIDER=replay,
  # in which case it ingests the synthetic fixture corpus into qdrant with
  # the real pinned embedder and generates the replay fixtures into the
  # shared volume — generate-then-serve, zero live API calls (see
  # scripts/seed_smoke_stack.py and tests/fixtures/replay/starter_smoke/).
  smoke-seeder:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "scripts/seed_smoke_stack.py"]
    environment:
      CLIMATE_CHAT_PROVIDER: "${CLIMATE_CHAT_PROVIDER:-anthropic}"
      CLIMATE_CHAT_REPLAY_DIR: "${CLIMATE_CHAT_REPLAY_DIR:-}"
      CLIMATE_CHAT_QDRANT_URL: "${CLIMATE_CHAT_QDRANT_URL:-http://qdrant:6333}"
      CLIMATE_CHAT_CORPUS_VERSION: "${CLIMATE_CHAT_CORPUS_VERSION:-dev-corpus-0000}"
      CLIMATE_CHAT_CORPUS_VINTAGE: "${CLIMATE_CHAT_CORPUS_VINTAGE:-2026-08-01}"
      CLIMATE_CHAT_SITE_URL: "${CLIMATE_CHAT_SITE_URL:-http://localhost:8000}"
      CLIMATE_CHAT_THRESHOLD_ARTIFACT: "${CLIMATE_CHAT_THRESHOLD_ARTIFACT:-/app/tests/fixtures/smoke/threshold.json}"
      CLIMATE_CHAT_DATASET_MANIFEST: "${CLIMATE_CHAT_DATASET_MANIFEST:-/app/tests/fixtures/smoke/dataset_manifest.yaml}"
      CLIMATE_CHAT_CHART_PACK_DIR: "${CLIMATE_CHAT_CHART_PACK_DIR:-/app/tests/fixtures/smoke/pack}"
    volumes:
      - replay_fixtures:/app/tests/fixtures/replay/starter_smoke
      - "${SMOKE_HF_CACHE:-hf_model_cache}:/root/.cache/huggingface"
    depends_on:
      qdrant:
        condition: service_healthy

  qdrant:
    # Pinned to the current stable release (checked 2026-08-16; released
    # 2026-08-05). Issue #10 must choose its qdrant-client pin against this
    # server version — bump the two together (finding #34).
    image: qdrant/qdrant:v1.19.0
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # Readiness, not TCP-connect: a bare port probe reports "healthy" the
      # moment the listener is up, before Qdrant is ready to serve. The
      # upstream image ships no curl/wget, so this issues a real HTTP GET of
      # /readyz using only bash builtins (printf/read over /dev/tcp) and
      # asserts the 200 status line. Notes hard-won from CI:
      # - 127.0.0.1, not localhost: Qdrant binds 0.0.0.0 (IPv4-only), and
      #   localhost may resolve to ::1 inside the container.
      # - IFS includes \r so the status code parses whether or not the
      #   server sends a reason phrase ("HTTP/1.1 200" vs "HTTP/1.1 200 OK");
      #   without it the trailing \r glues onto the code field.
      # It does depend on bash being present in the image (true of the
      # Debian-based upstream image, whose entrypoint is itself a bash
      # script); if an image variant ever drops bash, the smoke test's
      # compose-health assertion (test_compose_reports_services_healthy,
      # finding #33) turns that into a visible failure instead of silent
      # decoration.
      # Each step reports its own failure and the status line is echoed, so
      # `docker inspect .State.Health` (surfaced by the smoke test on
      # failure) shows exactly why a probe failed instead of a silent exit 1.
      # CRITICAL: every `$` is written `$$` because Compose interpolates
      # single-`$` references against the host environment BEFORE the command
      # reaches the container — an unescaped `$code` becomes the empty string
      # (Compose even warns 'The "code" variable is not set') and the check
      # fails forever with no output.
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/6333 || { echo "healthcheck: connect failed"; exit 1; }
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 || { echo "healthcheck: write failed"; exit 1; }
          if ! IFS=$$' \t\r' read -r -t 2 proto code rest <&3; then
            echo "healthcheck: no status line (EOF or timeout)"
            exit 1
          fi
          echo "healthcheck: $$proto $$code $$rest"
          [ "$$code" = 200 ]
      interval: 5s
      timeout: 3s
      retries: 10

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["streamlit", "run", "ui/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    # Issue #18: the Streamlit shell reaches the api's POST /chat SSE endpoint
    # through its ONE injected transport seam. In-compose the api is the
    # `api` service; CLIMATE_CHAT_SITE_URL is the public origin the shell uses
    # to render chart permalinks absolutely (copy/embed targets must resolve
    # off-site). Both pass through from the host with in-network defaults so a
    # plain `docker compose up` wires the shell to the api without extra flags.
    environment:
      CLIMATE_CHAT_API_URL: "${CLIMATE_CHAT_API_URL:-http://api:8000}"
      CLIMATE_CHAT_SITE_URL: "${CLIMATE_CHAT_SITE_URL:-http://localhost:8000}"
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8501/_stcore/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qdrant_storage:
  api_data:
  # The seeder-generated ReplayAdapter fixtures (finding #231), shared
  # between the smoke-seeder (writer) and the api (reader).
  replay_fixtures:
  # Model-weights cache default when SMOKE_HF_CACHE names no host
  # path (CI binds the runner's pre-fetched ~/.cache/huggingface instead).
  hf_model_cache:
