[project]
name = "lets-talk-climate-emergency"
version = "0.1.0"
description = "Let's Talk About the Climate Emergency — a free, open-source, public-benefit climate chatbot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "streamlit>=1.38,<2",
    "pandas>=2.2,<3",
    "vl-convert-python>=1.6,<2",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.20,<5",
    # Ingestion parse backends (issue #7, productionising the #2 spike):
    # Docling is the structure-aware primary; PyMuPDF is the loud degraded
    # fallback. Both are imported lazily inside ingestion.parse so the unit
    # tier never loads them; docling pulls torch/transformers (multi-GB).
    "docling>=2.120,<3",
    "pymupdf>=1.28,<2",
    # Qdrant client pinned against the composed server (qdrant/qdrant:v1.19.0,
    # docker-compose.yml finding #34) — bump the two together.
    "qdrant-client>=1.19,<1.20",
    # Local bge-m3 dense+sparse embedding (issue #9, ADR-005). FlagEmbedding
    # is BAAI's own inference wrapper for bge-m3's dense/sparse/colbert heads;
    # imported lazily inside rag.indexing.Bgem3EmbeddingModel only — the unit
    # tier never loads torch/transformers/FlagEmbedding (IMPLEMENTATION.md §3).
    "flagembedding>=1.4,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "pre-commit>=3.8,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "rag", "charts", "ui", "evals", "service"]

[tool.pytest.ini_options]
# Default run = the unit tier only (unmarked tests, IMPLEMENTATION.md §3).
# An explicit -m on the command line (e.g. `pytest -m integration`)
# overrides the -m here, since pytest takes the last -m given.
addopts = "--strict-markers -m 'not integration and not smoke and not live'"
testpaths = ["tests"]
markers = [
    "integration: requires Docker + local model weights, still no LLM key (IMPLEMENTATION.md §3)",
    "smoke: end-to-end docker compose smoke tests, replay-driven (IMPLEMENTATION.md §3)",
    "live: hits a real LLM/API; run per release or on demand only, never per PR (IMPLEMENTATION.md §3)",
    "perf: latency-budget evidence; records to the perf log every run, asserts the budget only on the demo hardware profile (issue #11)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ingestion", "rag", "charts", "ui", "evals", "service"]
