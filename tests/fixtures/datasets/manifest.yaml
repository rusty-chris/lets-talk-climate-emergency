# Fixture dataset manifest (issue #5; schema per DESIGN.md §2.1/§3.7 as
# amended by ADR-023 and review findings #45/#46). Valid entries only —
# the deliberate per-invariant violation entries live alongside the corpus
# violations in tests/fixtures/corpus/manifest.yaml.
#
# What the valid entries demonstrate, deliberately:
#   * every permitted_context the dataset schema accepts: open,
#     open-provisional (licence_note required, chart pack forbidden),
#     non-commercial-educational and permission-on-file (permission_evidence
#     required, review finding #78) — the non-open contexts always with
#     in_chart_pack: false;
#   * a multi-origin dataset with per-segment provenance records whose
#     attribution_text credits every segment (the review-#46 discipline);
#   * both legal splice-pair forms: an explicit `rebaseline: null` with
#     rationale (absolute-scale case) and a rebaseline block with
#     manifest-fixed alignment periods (ADR-020).
#
# No dataset files exist for these entries — ADR-023: no real dataset
# files in git; sha256 values pin the (invented) fetched bytes. Every
# licence string, URL, hash and date is invented; URLs use the reserved
# .invalid TLD so nothing here can ever resolve.

