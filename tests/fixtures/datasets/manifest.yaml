# Curation-time scientific decisions, fixed here per ADR-020 — one pair in
# each legal form.
splice_pairs:
  - id: syn-co2-splice
    paleo: syn-paleo-co2
    instrumental: syn-instrumental-co2
    splice_year_ce: 1959
    rationale: >
      Invented: absolute concentrations on a common scale, so no
      rebaseline is needed or legal for this pair.
    rebaseline: null
    resolution_note: "Invented: multi-decadal smoothing before 1959; annual instrumental after."

  - id: syn-temp-splice
    paleo: syn-provisional-reconstruction
    instrumental: syn-instrumental-temp
    splice_year_ce: 1880
    rationale: "Invented: first instrumental year."
    rebaseline:
      apply_to: syn-instrumental-temp
      alignment_period_ce: [1880, 1900]
      display_reference: "1800-1900 CE (invented native reference)"
      rationale: >
        Invented: maximal overlap between the instrumental record and the
        reconstruction's native reference century.
