# The real MVP corpus manifest (DESIGN §2.1–§2.3; issue #7, review #145).
#
# Rules of this file:
# - Every ACTIVE entry below is fully real: real licence evidence, a real
#   sha256 pin verified against re-fetched bytes, and a recorded sign-off.
#   The build refuses to load anything less (ingestion/manifest.py, #5).
# - Sources whose fetching/licensing work is NOT yet done are recorded in
#   the "Pending sources" skeleton at the bottom as comments — never as
#   fake entries with placeholder pins ('TBD' pins nothing, review #82).
# - Only `permitted_context: open` documents may have their fetched text
#   land under this directory (§2.1); ingest routes everything else to a
#   transient workspace (review #144). Fetched artefacts (*.pdf, *.html)
#   are re-fetchable from their pins and are gitignored.
