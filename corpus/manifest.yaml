# 2026-08-21 by the review-7 fix session, and owner-counter-signed on
# 2026-08-23. The 30 Tier-A expansion entries below them were prepared by
# the corpus-expansion agent session on 2026-09-07 (double-fetch pin
# verification + primary-page licence evidence) and owner-counter-signed
# the same day (sign-all-30 decision, corpus/EXPANSION-SIGNOFF.md); each
# note keeps the agent verification record inline per the nca5_ch2
# convention. All 32 active entries are therefore owner-signed.

