# deploy/compose.production.yml — production overlay: restart policies
# for the long-running base services (service/DEPLOYMENT.md §9).
#
# Applied ONLY when the operator opts in:
#
#   docker compose -f docker-compose.yml -f deploy/compose.production.yml \
#     --env-file /root/climate-chat.env --profile production up -d --build
#
# The base docker-compose.yml cannot carry these: adding restart to the
# dev/CI smoke stacks would change their crash behaviour (a failing api
# would restart-loop instead of staying visibly exited), and the whole
# ingress addition is pinned to leave those stacks byte-equivalent
# (tests/unit/test_production_ingress.py). The one-shot smoke-seeder is
# deliberately absent — restarting a completed one-shot would re-run it
# forever. The caddy service carries its own restart policy in the base
# file (it only exists under the production profile).
services:
  api:
    restart: unless-stopped
    # The four single sources of truth the #19 transparency build reads.
    # The image deliberately excludes them (.dockerignore: corpus/,
    # datasets/, voices/, letters/ — fetched Tier bytes and private
    # records never bake into layers), and release-run-5's #353
    # strengthening makes a live ingested deploy REFUSE at boot without
    # them. Mounted read-only, single file each, at the same
    # repo-relative /app paths service.main resolves; compose merges
    # volume lists by container path, so these append to the base
    # volumes. Production overlay only: the dev/CI stacks must keep the
    # #353 placeholder boundary the smoke tier pins.
    volumes:
      - ./corpus/manifest.yaml:/app/corpus/manifest.yaml:ro
      - ./datasets/manifest.yaml:/app/datasets/manifest.yaml:ro
      - ./voices/voices.yaml:/app/voices/voices.yaml:ro
      - ./letters/SENDING-RECORD.md:/app/letters/SENDING-RECORD.md:ro
  qdrant:
    restart: unless-stopped
  ui:
    restart: unless-stopped
