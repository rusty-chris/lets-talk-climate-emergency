repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: detect-private-key

  # Secret detection (review finding #35): the repo is slated to become
  # public, and near-term issues put ANTHROPIC_API_KEY in every dev/agent
  # environment (#14+, replay-fixture recording, evals). gitleaks scans
  # staged changes at commit time for credential patterns (including
  # Anthropic sk-ant- tokens); detect-private-key above covers private key
  # material and also scans the whole tree under CI's
  # `pre-commit run --all-files`.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
