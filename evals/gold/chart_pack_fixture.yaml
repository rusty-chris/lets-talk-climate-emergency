    retrieved_at: "2026-08-21"
    human_signoff: {who: "issue #20 gold-set author", date: "2026-08-21", note: "synthetic fixture entry"}
    permitted_context: open
    in_chart_pack: true
    data_file: evals/gold/synthetic_data/syn_temp_paleo.csv
    time_axis: {unit: years_bp, present_ce: 1950}
    variable: {name: temp_anomaly_c, unit: degC_anomaly}
