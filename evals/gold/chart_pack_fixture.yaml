splice_pairs:
  - id: syn_co2_10k
    paleo: syn_co2_paleo
    instrumental: syn_co2_modern
    splice_year_ce: 1959
    rationale: "synthetic — first synthetic instrumental CO2 year"
    rebaseline: null
    resolution_note: "multi-decadal before 1959; annual after"
    overlap:
      policy: prefer_instrumental
      discarded: "syn_co2_paleo samples from 1959 CE onward (post-splice)"
      note: "overlapping paleo samples omitted in favour of the instrumental record"

  - id: syn_temp_10k
    paleo: syn_temp_paleo
    instrumental: syn_temp_modern
    splice_year_ce: 1880
    rationale: "synthetic — first synthetic instrumental temperature year"
    rebaseline:
      apply_to: syn_temp_modern
      alignment_period_ce: [1880, 1900]
      display_reference: "1800-1900 CE (syn_temp_paleo native reference)"
      disclosure: >-
        syn_temp_modern shifted so its 1880-1900 mean equals the 1800-1900
        reference (syn_temp_paleo's native baseline)
    resolution_note: "centennial before 1880; annual after"
    overlap:
      policy: prefer_instrumental
      discarded: "syn_temp_paleo bins from 1880 CE onward (post-splice)"
      note: "overlapping proxy bins omitted in favour of the instrumental record"

  - id: syn_pending_pair
    paleo: syn_pending
    instrumental: syn_temp_modern
    splice_year_ce: 1900
    rationale: "synthetic — a pair blocked on a non-pack member (the #117 shape)"
    rebaseline: null
    resolution_note: "synthetic"
    overlap:
      policy: prefer_instrumental
      discarded: "n/a"
      note: "synthetic"
