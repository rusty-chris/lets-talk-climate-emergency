  - id: qa-mp-10
    category: multi_passage
    question: "What decides whether and when the world crosses 2°C of warming?"
    expected_behaviour: answer
    recall_semantics: all_gold
    gold_chunk_ids:
      - "nca5_ch2:13d694a01251361e"
      - "nca5_ch2:dfe026420886ec2d"
    notes: >-
      Emissions + climate sensitivity chunk, plus the biggest-uncertainty-is-
      what-we-do chunk.

  # ================================================================
  # no_answer (39) — refusal expected; calibration and gate DISJOINT.
  # Composition after review findings #192/#193:
  #   calibration 15 = 10 retrieval_refusal + 5 canned_out_of_scope
  #   gate        24 = 20 retrieval_refusal + 4 canned_out_of_scope
  # Calibration retrieval_refusal items (10) tune the refusal threshold
  # (#11); gate retrieval_refusal items (20) are the DESIGN §6.2 release
  # metric (>90% refusal; at n=20 a single flake is 19/20 = 95% and the
  # strict gate survives — critic finding 15's intent). The 9
  # canned_out_of_scope items are checked for the classifier's canned
  # decline and NEVER counted in the reranker calibration or gate
  # (selection seam: evals/gold_selection.py). The retrieval_refusal
  # items are genuinely in-scope climate questions today's two-document
  # corpus cannot answer, phrased to stay refusal-stable under every
  # planned corpus expansion (corpus/manifest.yaml pending tiers) —
  # the qa-na-g-06/g-08 peer-review standard.
  # ================================================================
  - id: qa-na-c-01
    category: no_answer
    subset: calibration
    expected_route: canned_out_of_scope
    question: "What will the weather be like in Manchester next weekend?"
    expected_behaviour: refusal
    smoke: true
    notes: "Weather forecast, not climate evidence; corpus has no forecasts."

  - id: qa-na-c-02
