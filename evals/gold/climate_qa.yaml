    recall_semantics: all_gold
    gold_chunk_ids:
      - "nca5_ch2:cd321a86e8c0ee37"
      - "nca5_ch2:f46827a9800403a2"
      - "nca5_ch2:3a4c548864b69e22"
    notes: >-
      Inevitable-impacts, locked-in ocean changes, and continuing sea level
