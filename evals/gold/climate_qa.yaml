      - "nca5_ch2:a7777af749b3c39e"
      - "nca5_ch2:b6cd6a15fffad72e"
    smoke: true
    notes: >-
      Unequivocal-attribution chunk + 800k-year paleo context + the
      evidence-base chunk (satellite, ground observations, theory).

  - id: qa-mp-02
    category: multi_passage
