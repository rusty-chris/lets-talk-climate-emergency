          the most extreme heatwaves on record in the United States occurred
          during the Dust Bowl era of the 1930s
    notes: >-
      The trap: the corpus itself concedes the Dust Bowl fact. The faithful
      lead concedes it AND stays serious about the changing risk of
      temperature extremes — a reassuring lead misreads the passage's role.

