# SYNTHETIC GOLD SET — every question below was authored fresh for this
# repository (issue #20). No question is, or derives from, real user text
# (DESIGN §8: harvested queries never enter the repo). Source-passage
# quotes are verbatim excerpts from the two licence-gated corpus documents
# (NCA5 Ch.2: public domain; Wunderling et al. 2024: CC BY 4.0) — quoting
# them here is licence-clean and required by DESIGN §6.1 (severity
# annotations carry the passage they derive from).
#
# Composition (DESIGN §6.1 as amended, incl. review findings #192/#193;
# enforced by tests/unit/test_gold_sets.py):
#   single_passage 15 | multi_passage 10 | no_answer 39 (15 calibration +
#   24 gate, disjoint; of which 10 + 20 are retrieval_refusal — the
#   calibration and release-gate ns — and 5 + 4 canned_out_of_scope) |
#   adversarial 7 | severity 15 | voices_action 5 | targeted 3  == 94 items.
#
# Item schema:
#   id                 unique, category-prefixed
#   category           one of the seven above
#   question           the synthetic user question (the authored artefact)
#   expected_behaviour answer | refusal
#   gold_chunk_ids     REAL chunk ids from the current ingest
#                      (data/ingest/chunks.jsonl, snapshot committed at
#                      evals/gold/ingest_chunk_ids.txt). Required for
#                      single_passage/multi_passage; carried on severity/
#                      adversarial/targeted items where today's two-document
#                      corpus supports them.
#   recall_semantics   multi_passage only (review finding #196): all_gold |
#                      any_gold. all_gold — the #21 Recall@8 metric counts
#                      the item recalled only when EVERY gold chunk is
#                      surfaced (the category's purpose: retrieval must
#                      surface all passages a synthesis answer needs).
#                      any_gold — any one gold chunk suffices (a stated
#                      minority; used where one chunk substantially answers
#                      and the rest enrich). Declared per item — the harness
#                      has NO default; prose notes never carry scoring
#                      semantics.
#   subset             no_answer only: calibration | gate. Calibration items
#                      tune the refusal threshold and are NEVER counted in
#                      the release gate; gate items are the >90%-refusal
#                      release metric (DESIGN §6.2). Disjoint by meta-test.
#   expected_route     no_answer only (review finding #192): the refusal
#                      mechanism the item exercises.
#                      canned_out_of_scope — the classifier labels the query
#                        out_of_scope and rag/query.py::route_classification
#                        returns the canned decline; retrieval never runs and
#                        no reranker score exists. Covered by the classifier's
#                        own labelled-set gate; checked end-to-end for the
#                        canned decline but NEVER consumed by the reranker
#                        threshold calibration or the >90% refusal gate.
#                      retrieval_refusal — in-scope climate material today's
#                        corpus cannot answer; retrieval runs and the reranker
#                        refusal gate must fire. ONLY these items feed
#                        calibrate_refusal_threshold and the release gate
#                        (selection seam: evals/gold_selection.py).
#   severity           severity items only: expected_lead on the 3-point
#                      ordinal scale (reassuring | serious | emergency-level;
#                      level boundaries, decision rules and worked examples
#                      are written in evals/gold/severity-rubric.md — finding
#                      #195 — which the #21 judge prompt embeds verbatim),
#                      the bait direction (soft-pedal | inflation | neutral),
#                      and the source passage the annotation derives from —
#                      either {chunk_id, quote} (quote is a verbatim substring
#                      of that chunk's body) or, on blocked items,
#                      {pending_doc_id, description}.
#   reception_rubric   adversarial items only: the persuadable-sceptic
#                      reception criteria (DESIGN §6.2 — "welcoming to the
#                      unconvinced", not just resistant to attack).
#   targeted           targeted items only: packham | sensitivity_assessed_range
#                      | carbon_brief_paraphrase.
#   expectations       targeted items only: the behaviours the item exists
#                      to check, as reviewable prose.
#   blocked_on         corpus-expansion — the item's full evaluation needs
#                      corpus documents not yet licence-gated/ingested
#                      (corpus/manifest.yaml "Pending sources"). Requires
#                      blocked_reason. Counted in evals/gold/COVERAGE.md
#                      (the no-silent-caps ledger).
#   blocked_reason     why, naming the pending manifest entries.
#   smoke              true on exactly the 10-item development smoke subset
#                      (issue #20 budget comment: iterate on ~10 questions;
#                      full 75 reserved for gate checks). Smoke items are
#                      never blocked.
#   notes              reviewer-facing rationale.

marker: "SYNTHETIC GOLD SET — questions authored for this project; no real user text"
corpus_documents: [nca5_ch2, esd_tipping_review]

items:
  # ================================================================
  # single_passage (15) — answerable from one gold chunk
  # ================================================================
  - id: qa-sp-01
    category: single_passage
    question: "How much has the planet actually warmed so far?"
    expected_behaviour: answer
    gold_chunk_ids: [ "nca5_ch2:ed15c37b68d49d7b" ]
    smoke: true
    notes: >-
      Gold chunk states 2012-2021 was ~2°F (1.1°C) above 1850-1899 with the
      accompanying large-scale changes.

  - id: qa-sp-02
    category: single_passage
    question: "How certain are scientists that human activity is behind the warming?"
    expected_behaviour: answer
    gold_chunk_ids: [ "nca5_ch2:824e17297a634f4f" ]
    notes: >-
      "It is unequivocal" chunk; also exercises calibrated-language
      preservation (virtually certain / very high confidence).

  - id: qa-sp-03
    category: single_passage
    question: "Are today's CO2 levels unusual compared with Earth's past?"
    expected_behaviour: answer
    gold_chunk_ids: [ "nca5_ch2:a7777af749b3c39e" ]
    notes: >-
      800,000-year ice-core record; last comparable CO2 ~3.2 million years
      ago with sea level 18-63 feet higher.

  - id: qa-sp-04
    category: single_passage
    question: "Does the CO2 we emitted decades ago still affect the climate today?"
    expected_behaviour: answer
    gold_chunk_ids: [ "nca5_ch2:6968446ea6df781a" ]
    notes: >-
      CO2 lingers for thousands of years; includes the COVID-emissions-dip
      fact as a natural follow-on.

  - id: qa-sp-05
    category: single_passage
    question: "Which countries have contributed most to the CO2 in the atmosphere?"
    expected_behaviour: answer
    gold_chunk_ids: [ "nca5_ch2:948d7ea48c3368a7" ]
    notes: >-
      Annual-vs-cumulative distinction: China largest annual emitter; US and
      Europe majority of cumulative emissions.

  - id: qa-sp-06
    category: single_passage
    question: "Are extreme weather events really becoming more frequent and severe?"
    expected_behaviour: answer
    gold_chunk_ids: [ "nca5_ch2:273f263e604f741d" ]
    notes: >-
      Heatwaves, drought, extreme rainfall, hurricanes, wildfires — each with
      its assessed confidence level.

  - id: qa-sp-07
    category: single_passage
    question: "Is climate change already costing money, or is that still to come?"
    expected_behaviour: answer
    gold_chunk_ids: [ "nca5_ch2:067c707becbbf816" ]
    notes: >-
      Billion-dollar disasters chunk; 18 events in 2022 alone.

  - id: qa-sp-08
    category: single_passage
    question: "Is heavy rainfall getting worse, and where?"
    expected_behaviour: answer
    gold_chunk_ids: [ "nca5_ch2:61a28ddcd74ed8c1" ]
    notes: >-
      Upward trend since the 1950s; Northeast ~60% / Midwest ~45% increase in
      extreme precipitation days.

  - id: qa-sp-09
    category: single_passage
    question: "What role does climate change play in the wildfires we keep seeing?"
    expected_behaviour: answer
    gold_chunk_ids: [ "nca5_ch2:ec41b71289116e4a" ]
    notes: >-
      Human-caused warming responsible for ~68% of the observed increase in
      western aridity, 1979-2020.

  - id: qa-sp-10
    category: single_passage
    question: "What exactly is a climate tipping point?"
    expected_behaviour: answer
    gold_chunk_ids: [ "esd_tipping_review:bc194367d2056116" ]
    smoke: true
    notes: >-
      Definitional chunk from the tipping review's introduction: tipping
      elements, tipping points, examples.

  - id: qa-sp-11
    category: single_passage
    question: "Can one climate tipping point set off others, like dominoes?"
    expected_behaviour: answer
    gold_chunk_ids: [ "esd_tipping_review:a10871de533a2683" ]
    notes: >-
      Tipping-cascade definition; Greenland Ice Sheet -> AMOC -> ENSO example
      chain.

  - id: qa-sp-12
    category: single_passage
    question: "What is the AMOC and why do scientists watch it so closely?"
    expected_behaviour: answer
    gold_chunk_ids: [ "esd_tipping_review:57523cbc14ff1fa4" ]
    notes: >-
      AMOC depends on dense-water formation in the high-latitude North
      Atlantic; freshwater from Greenland melt can disturb it.

  - id: qa-sp-13
    category: single_passage
    question: "What would happen to the climate if the Atlantic circulation collapsed?"
    expected_behaviour: answer
    gold_chunk_ids: [ "esd_tipping_review:4d87de1f7c96baee" ]
    notes: >-
      Northern Hemisphere cooling, Southern Hemisphere warming, WAIS
      destabilisation via warmer Southern Ocean.

  - id: qa-sp-14
    category: single_passage
    question: "If the world stopped emitting CO2 tomorrow, would the warming stop?"
    expected_behaviour: answer
    gold_chunk_ids: [ "nca5_ch2:cd321a86e8c0ee37" ]
    notes: >-
      Most models project warming stops at net zero, but an end to warming is
      not an end to climate change — slow components keep adjusting.

  - id: qa-sp-15
    category: single_passage
    question: "How bad could sea level rise get by the end of the century?"
    expected_behaviour: answer
    gold_chunk_ids: [ "nca5_ch2:9b1041506818bf7b" ]
    notes: >-
      3-6 feet by 2100 / 5-12 feet by 2150 cannot be ruled out (>=1% chance
      at 1.5°-4°C warming levels).

  # ================================================================
