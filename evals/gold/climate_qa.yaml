  - id: qa-mp-05
    category: multi_passage
    question: "How do the Greenland and Antarctic ice sheets and the Atlantic circulation affect each other?"
    expected_behaviour: answer
    recall_semantics: all_gold
    gold_chunk_ids:
      - "esd_tipping_review:57523cbc14ff1fa4"
      - "esd_tipping_review:4b95fda7410ea346"
      - "esd_tipping_review:4d87de1f7c96baee"
    smoke: true
    notes: >-
      GIS->AMOC, WAIS->AMOC, and AMOC->ice-sheets chunks: the answer needs
      both directions of the interaction.

  - id: qa-mp-06
    category: multi_passage
    question: "Could several tipping points combine into a planet-wide cascade?"
    expected_behaviour: answer
    recall_semantics: any_gold
    gold_chunk_ids:
      - "esd_tipping_review:ef6f62a2b3b147d1"
      - "esd_tipping_review:3bf8332cc39f33d8"
      - "esd_tipping_review:a10871de533a2683"
    notes: >-
      Planetary-scale-cascade section + global-feedback chunk + the cascade
      definition. Peer-review note (second pass): the first chunk alone
      substantially answers the question — hence recall_semantics:
      any_gold on THIS item (review finding #196: the scoring semantics
      moved from this note's prose into the per-item field; no
      harness-wide default exists).

  - id: qa-mp-07
    category: multi_passage
    question: "Has the climate ever changed abruptly before, and what caused it?"
    expected_behaviour: answer
    recall_semantics: all_gold
    gold_chunk_ids:
      - "esd_tipping_review:40680c0997922ce6"
      - "esd_tipping_review:4f3d5e3033fa9e13"
    notes: >-
      Bølling-Allerød and Dansgaard-Oeschger paleo chunks: abrupt past
      transitions tied to AMOC state changes.

  - id: qa-mp-08
    category: multi_passage
    question: "How does El Niño interact with the Amazon rainforest and coral reefs?"
    expected_behaviour: answer
    recall_semantics: all_gold
    gold_chunk_ids:
      - "esd_tipping_review:c9b5d29a25cadfc6"
      - "esd_tipping_review:2d1aa4ff32c7dfb8"
    notes: >-
      ENSO->Amazon and ENSO->coral chunks; a two-system synthesis question.

  - id: qa-mp-09
    category: multi_passage
    question: "How much sea level rise are we already committed to, and how much worse could it plausibly get?"
    expected_behaviour: answer
