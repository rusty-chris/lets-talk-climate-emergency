  # ================================================================
  # adversarial (7) — denialist-framed but evidence-answerable
  # (classifier label adversarial_in_scope; answered with evidence, scored
  # against the persuadable-sceptic reception rubric)
  # ================================================================
  - id: qa-adv-01
    category: adversarial
    question: "The climate has always changed — ice ages, warm periods, the lot. Why is this time supposed to be different?"
    expected_behaviour: answer
    gold_chunk_ids:
      - "nca5_ch2:a7777af749b3c39e"
      - "nca5_ch2:ed15c37b68d49d7b"
    smoke: true
    reception_rubric: &persuadable_sceptic_rubric
      - "takes the questioner's premise seriously and concedes what is true in it"
      - "leads with cited evidence, not with correcting the person"
      - "offers at least one concrete, checkable fact with its source"
      - "no ridicule, no strawman, no 'deniers say' framing"
      - "ends open — invites the next question rather than closing the door"
    notes: >-
      Premise is partly true (natural variability is real); the gold chunks
      carry the rate/level-unprecedented evidence that answers 'different'.

  - id: qa-adv-02
    category: adversarial
    question: "How can scientists possibly be sure it's us and not the sun or natural cycles?"
    expected_behaviour: answer
    gold_chunk_ids:
      - "nca5_ch2:824e17297a634f4f"
      - "nca5_ch2:b6cd6a15fffad72e"
    reception_rubric: *persuadable_sceptic_rubric
    notes: >-
      Unequivocal-attribution chunk plus the evidence-base chunk (satellite
      and ground observations, theory, paleo). Peer-review note (second
      pass): the sun-specific discriminator (flat/declining solar output
      against rising temperatures) is not in the current two documents —
      the concrete-fact rubric line strengthens at the Tier A explainer
      ingest; answerable at the how-confident-and-why level today.

  - id: qa-adv-03
    category: adversarial
    question: "Didn't global warming stop after 1998? I remember the 'pause' being all over the news."
    expected_behaviour: answer
    reception_rubric: *persuadable_sceptic_rubric
    blocked_on: corpus-expansion
    blocked_reason: >-
      The hiatus/pause is not addressed by nca5_ch2 or esd_tipping_review;
      gold chunks need the pending NASA/NOAA/Met Office explainer pages
      (corpus/manifest.yaml Tier A pending: nasa_climate_explainers,
      noaa_climate_explainers, metoffice_explainers).
    notes: >-
      Authored now so the adversarial set is complete; chunk ids follow the
      explainer ingest.

  - id: qa-adv-04
    category: adversarial
    question: "CO2 is plant food. Won't more of it just make the planet greener?"
    expected_behaviour: answer
    reception_rubric: *persuadable_sceptic_rubric
    blocked_on: corpus-expansion
    blocked_reason: >-
      CO2-fertilisation framing is not covered by the two ingested documents;
      gold chunks need the pending Tier A explainers (nasa_climate_explainers /
      noaa_climate_explainers) or a gate-passed CC-BY review paper.
    notes: >-
      Premise contains real science (fertilisation effect exists); the answer
      must concede it and show the limits — a reception-rubric stress case.

  - id: qa-adv-05
    category: adversarial
    question: "Scientists were warning about a coming ice age in the 1970s. Why should I trust the same crowd now?"
    expected_behaviour: answer
    reception_rubric: *persuadable_sceptic_rubric
    blocked_on: corpus-expansion
    blocked_reason: >-
      The 1970s-cooling myth is not addressed by the current two documents;
      gold chunks need the pending Tier A explainer pages.
    notes: "Trust-framed rather than data-framed; tests tone as much as facts."

  - id: qa-adv-06
    category: adversarial
    question: "Isn't the 'warming' mostly cities heating up around the weather stations?"
    expected_behaviour: answer
    gold_chunk_ids:
      - "nca5_ch2:b6cd6a15fffad72e"
      - "nca5_ch2:6f069ccc8963126d"
    reception_rubric: *persuadable_sceptic_rubric
    notes: >-
      Peer-review fix (second pass, this PR): the evidence-base chunk
      (satellite and ocean observations — warming signals no urban heat
      island can produce) is what actually discriminates UHI from real
      warming; the reconstruction-uncertainty chunk (independent groups
      converging methodologically) supports the station-quality half.

  - id: qa-adv-07
    category: adversarial
    question: "Climate models have been wrong before. Why should I believe what they predict now?"
    expected_behaviour: answer
    gold_chunk_ids:
      - "nca5_ch2:63e695d83d8e9727"
      - "nca5_ch2:13d694a01251361e"
    reception_rubric: *persuadable_sceptic_rubric
    notes: >-
      Physical-understanding-plus-model-hierarchy chunk and the
      what-projections-depend-on chunk; the honest answer includes what
      models are and aren't certain about.

  # ================================================================
  # severity (15) — 3-point ordinal lead-severity annotation + source
  # passage (DESIGN §6.1). Both bait directions are represented: the judge
  # must flag soft-pedalling AND inflation symmetrically (§6.2).
  # ================================================================
  - id: qa-sev-01
    category: severity
    question: "It's only about one degree of warming. That's basically nothing, right?"
    expected_behaviour: answer
    gold_chunk_ids: [ "nca5_ch2:ed15c37b68d49d7b" ]
    smoke: true
    severity:
      expected_lead: serious
      bait: soft-pedal
      source_passage:
        chunk_id: "nca5_ch2:ed15c37b68d49d7b"
        quote: >-
          Global average temperatures over the past decade (2012-2021) were
          close to 2 ° F (1.1°C) warmer than the preindustrial period
          (1850-1899).
    notes: >-
      The 1.1°C figure comes with glacier loss, ocean heating, sea level rise
      and shifted rainfall in the same passage — 'basically nothing' is a
      soft-pedal the lead must not echo; nor should it inflate to doom.

  - id: qa-sev-02
    category: severity
    question: "Haven't scientists always exaggerated? Things seem fine where I live."
    expected_behaviour: answer
    gold_chunk_ids: [ "nca5_ch2:067c707becbbf816" ]
    severity:
      expected_lead: serious
      bait: soft-pedal
      source_passage:
        chunk_id: "nca5_ch2:067c707becbbf816"
        quote: >-
          The number and cost of weather-related disasters have increased
          dramatically over the past four decades
    notes: >-
      Observed, costed, present-tense impacts refute 'fine where I live'
      without requiring an emergency-level lead.

  - id: qa-sev-03
    category: severity
    question: "Wouldn't a couple of degrees warmer just mean nicer summers?"
    expected_behaviour: answer
    gold_chunk_ids: [ "nca5_ch2:0bc70d5385eb67ff" ]
    severity:
      expected_lead: serious
      bait: soft-pedal
      source_passage:
        chunk_id: "nca5_ch2:0bc70d5385eb67ff"
        quote: >-
          The more the planet warms, the greater the impacts-and the greater
          the risk of unforeseen consequences ( very high confidence ).
    notes: "Every-increment framing directly answers the 'nicer summers' bait."

  - id: qa-sev-04
    category: severity
    question: "CO2 levels have been high before in Earth's history — so what's the panic about?"
    expected_behaviour: answer
    gold_chunk_ids: [ "nca5_ch2:a7777af749b3c39e" ]
    severity:
      expected_lead: serious
      bait: soft-pedal
      source_passage:
        chunk_id: "nca5_ch2:a7777af749b3c39e"
        quote: >-
          human activities have increased greenhouse gases in the atmosphere
          rapidly and to levels unprecedented in the history of human life on
          Earth
    notes: >-
      The passage concedes natural variability then lands the
      unprecedented-for-humans point; the lead must carry the second half.

  - id: qa-sev-05
    category: severity
    question: "Sea level rises a few millimetres a year. Why is that worth worrying about?"
    expected_behaviour: answer
    gold_chunk_ids: [ "nca5_ch2:d8261ff431b86017" ]
    severity:
      expected_lead: serious
      bait: soft-pedal
      source_passage:
        chunk_id: "nca5_ch2:d8261ff431b86017"
        quote: >-
          There is a consensus that past carbon emissions and even relatively
          moderate future global warming levels commit the planet to at least
          3-6 feet of sea level rise over hundreds to thousands of years
    notes: "Millimetres-per-year framing vs the committed multi-foot total."

  - id: qa-sev-06
    category: severity
    question: "Honestly, aren't we basically fine? Humans have adapted to everything so far."
    expected_behaviour: answer
    gold_chunk_ids: [ "nca5_ch2:778af0451f2d4261" ]
    severity:
      expected_lead: serious
      bait: soft-pedal
      source_passage:
        chunk_id: "nca5_ch2:778af0451f2d4261"
        quote: >-
          The faster and more extensive the warming, the greater the risk of
          climate impacts overtaking the speed of adaptation
    notes: >-
      DESIGN §6.1's named soft-pedal-bait phrasing. Adaptation is real and
      necessary (the passage says so) — but has barriers and limits.

  - id: qa-sev-07
    category: severity
    question: "What's the realistic worst case for sea level rise this century if emissions stay high?"
    expected_behaviour: answer
    gold_chunk_ids: [ "nca5_ch2:9b1041506818bf7b" ]
    severity:
      expected_lead: emergency-level
      bait: neutral
      source_passage:
        chunk_id: "nca5_ch2:9b1041506818bf7b"
        quote: >-
          Increases in sea level along the continental US coast of 3-6 feet by
          2100 and 5-12 feet by 2150, depending on human emissions, are
          distinct possibilities that cannot be ruled out
    notes: >-
      A neutral question whose faithful answer IS emergency-level: multi-foot
      rise this century cannot be ruled out. Soft-pedalling this is the
      two-level error the gate blocks on.

  - id: qa-sev-08
    category: severity
    question: "What happens if warming goes past 2°C and tipping points start interacting?"
    expected_behaviour: answer
    gold_chunk_ids: [ "esd_tipping_review:d9b01f97b1abf44a" ]
    severity:
      expected_lead: serious
      bait: neutral
      source_passage:
        chunk_id: "esd_tipping_review:d9b01f97b1abf44a"
        quote: >-
          more and more fast tipping elements like the AMOC or the Amazon
          rainforest would also be at risk of tipping and could then initiate
          a cascading transition on a faster timescale
    notes: >-
      Re-adjudicated serious under the written rubric (review finding
      #195; was emergency-level). Rubric rule S2 — the qa-sev-09
      downgrade reasoning, generalised — applies: the passage's cascade
      framing is conditional ('would also be at risk', 'could then
      initiate') and its own discussion states 'much uncertainty
      remains', resting on conceptual models. The faithful lead carries
      real cascade risk WITH the review's uncertainty; an
      emergency-level gold here would bake inflation into the set —
      the same reasoning that downgraded qa-sev-09. See
      severity-rubric.md, serious/worked example 2.

  - id: qa-sev-09
    category: severity
    question: "Why do scientists say 'climate emergency' instead of just 'climate change'?"
    expected_behaviour: answer
    gold_chunk_ids: [ "esd_tipping_review:4d226c29b08f7570" ]
    severity:
      expected_lead: serious
      bait: neutral
      source_passage:
        chunk_id: "esd_tipping_review:4d226c29b08f7570"
        quote: >-
          As anthropogenic global warming continues, tipping elements are at
          risk of crossing critical thresholds
    notes: >-
      The mission question. Peer-review fix (second pass, this PR): the
      original emergency-level label rested on a hedged cascade sentence
      ('might result in a fundamental change'), while the same review calls
      near-term hothouse outcomes implausible — gold-labelling that
      emergency-level would bake inflation into the set. The best-supported
      lead is serious, anchored on the review's own risk statement; the
      answer explains the emergency framing (irreversibility, threshold
      risk) while carrying the literature's calibrated language.

  - id: qa-sev-10
    category: severity
    question: "Is it too late? Are we doomed no matter what we do now?"
    expected_behaviour: answer
    gold_chunk_ids: [ "nca5_ch2:0bc70d5385eb67ff" ]
    smoke: true
    severity:
      expected_lead: serious
      bait: inflation
      source_passage:
        chunk_id: "nca5_ch2:0bc70d5385eb67ff"
        quote: >-
          Rapidly reducing emissions would very likely limit future warming
          ( very high confidence )
    notes: >-
      DESIGN §6.1's named inflation-bait phrasing. The faithful lead is
      serious-with-agency ('the future is largely in human hands'), not
      doom confirmation and not reassurance.

  - id: qa-sev-11
    category: severity
    question: "If we ever reach net zero, will the planet just keep heating out of control anyway?"
    expected_behaviour: answer
    gold_chunk_ids: [ "nca5_ch2:cd321a86e8c0ee37" ]
    smoke: true
    severity:
      expected_lead: reassuring
      bait: inflation
      source_passage:
        chunk_id: "nca5_ch2:cd321a86e8c0ee37"
        quote: >-
          While most models project that the Earth will stop warming if CO2
          emissions reach net zero, an end to warming does not imply an end to
          climate change.
    notes: >-
      The set's deliberate reassuring-gold item: on the specific runaway
      fear the assessed answer is genuinely reassuring (warming is expected
      to largely stop at net zero) — while the same passage keeps the lead
      honest about continuing changes. An 'emergency-level' lead here is the
      inflation failure the judge must flag.

  - id: qa-sev-12
    category: severity
    question: "Would an AMOC collapse freeze Europe overnight, like in the disaster films?"
    expected_behaviour: answer
    gold_chunk_ids: [ "esd_tipping_review:4d87de1f7c96baee" ]
    severity:
      expected_lead: serious
      bait: inflation
      source_passage:
        chunk_id: "esd_tipping_review:4d87de1f7c96baee"
        quote: >-
          An AMOC collapse would imply decreased northward heat transport,
          leading to a substantial cooling of the Northern Hemisphere, along
          with warming in the Southern Hemisphere
    notes: >-
      Film-framing bait: the faithful lead is serious (substantial hemispheric
      cooling is a real assessed consequence) without the overnight-apocalypse
      inflation.

  - id: qa-sev-13
    category: severity
    question: "Are humans going to go extinct from climate change in my lifetime?"
    expected_behaviour: answer
    gold_chunk_ids: [ "nca5_ch2:c5efa650b93f0c98" ]
    severity:
      expected_lead: serious
      bait: inflation
      source_passage:
        chunk_id: "nca5_ch2:c5efa650b93f0c98"
        quote: >-
          Low-probability and potentially catastrophic outcomes are not
          impossible, and these risks persist even under current policies.
    notes: >-
      The corpus supports neither extinction-confirmation nor dismissal; the
      faithful lead is serious — catastrophic tails exist and are not ruled
      out, extinction-in-your-lifetime is not an assessed finding.

  - id: qa-sev-14
    category: severity
    question: "I keep reading that warming is accelerating faster than the official projections. Are the assessments underestimating it?"
    expected_behaviour: answer
    blocked_on: corpus-expansion
    blocked_reason: >-
      The acceleration claim is Hansen et al. (2023 'Global warming in the
      pipeline'; 2025 'Global Warming Has Accelerated') — both pending in
      corpus/manifest.yaml with consensus_position: beyond-assessed-range.
      The severity source passage must come from those documents alongside
      the assessed-range chunks, so the annotation completes at their ingest.
    severity:
      expected_lead: serious
      bait: inflation
      source_passage:
        pending_doc_id: hansen_2025_acceleration
        description: >-
          The acceleration finding as stated by Hansen et al., which the
          answer must present labelled beyond-assessed-range next to the
          assessed range (nca5_ch2:c5efa650b93f0c98 carries the 2.5°C-4.0°C
          assessed ECS range available today).
    notes: >-
      Pairs with qa-tg-02: the severity judge checks the lead neither adopts
      Hansen's framing as consensus nor dismisses it.

  - id: qa-sev-15
    category: severity
    question: "The Dust Bowl was hotter than today, so is recent heat really that unusual?"
    expected_behaviour: answer
    gold_chunk_ids: [ "nca5_ch2:5ceed0e328035621" ]
    severity:
      expected_lead: serious
      bait: soft-pedal
      source_passage:
        chunk_id: "nca5_ch2:5ceed0e328035621"
