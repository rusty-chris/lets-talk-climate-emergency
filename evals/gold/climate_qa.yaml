  # ----- calibration retrieval_refusal items added per #192/#193 -------
  - id: qa-na-c-11
    category: no_answer
    subset: calibration
    expected_route: retrieval_refusal
    question: "How much stronger have western Pacific typhoons become since the 1980s?"
    expected_behaviour: refusal
    notes: >-
      In-scope hard negative: nca5_ch2 assesses Atlantic/US hurricane
      trends, so retrieval finds near-topic material — but no corpus
      document covers the western Pacific basin, and no planned ingest
      (explainers, EGR, Hansen, Carbon Brief attribution) tabulates a
      basin-specific intensity trend. Exactly the boundary the threshold
      must sit above.

  - id: qa-na-c-12
    category: no_answer
    subset: calibration
    expected_route: retrieval_refusal
    question: "How is climate change shifting harvest timing for staple crops in India?"
    expected_behaviour: refusal
    notes: >-
      In-scope regional-agriculture question; neither ingested document
      covers South Asian cropping, and the planned Tier A explainers /
      Tier B reports do not carry India-specific harvest phenology.
      (Phrased around harvests, not the monsoon system — the Indian
