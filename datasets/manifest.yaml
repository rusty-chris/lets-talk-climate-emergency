# Chart data-pack manifest. Schema enforced by ingestion/manifest.py
# (issue #5); full pack curation/fetch tooling lands in #14/#16. This file
# still carries the two curation-time scientific decisions that ADR-020
# says live here, not in the LLM or the renderer:
#   * which dataset pairs may be spliced, and at which year;
#   * the legal rebaseline alignment period per pair.
# sha256 values are for the exact files fetched 2026-08-16 (URLs below);
# raw downloads live in gitignored data/spike/, never in the repo.
#
# Pack invariant (DESIGN 2.1/3.7): only confirmed `permitted_context: open`
# datasets may have `in_chart_pack: true`. kaufman2020_temp12k and (per
# review finding #45, below) bereiter2015_co2 are `open-provisional` —
# their licence_note records the evidence trail; see
# reviews/spike-04-chart-findings.md for the full check. noaa_gml_co2_mlo
# carries per-segment `provenance` (review finding #46): its 1959-1974
# annual means derive from Scripps/Keeling measurements, not a US
# Government work, and the Scripps credit the source file requests is
# recorded and carried into attribution_text.
#
# human_signoff on every entry below records the review/implementation
# trail that established these licence facts (review findings #45/#46,
# reviews/spike-04-chart-findings.md) — it is an autonomous-pipeline
# record per ORCHESTRATION.md, not an individual human's personal
# line-by-line confirmation of each archive's terms; DESIGN §2.2 step 3
# still names a human sign-off as part of the licensing gate, so this
# should get a human look before these datasets are relied on for a
# release (flagged in the issue #5 PR).

version: 0.0.1-spike
access_date: "2026-08-16"

datasets:
  bereiter2015_co2:
    title: "Antarctic Ice Cores Revised 800KYr CO2 Data (composite)"
    provider: "NOAA NCEI Paleoclimatology (WDS Paleo), study 17975"
    url: "https://www.ncei.noaa.gov/pub/data/paleo/icecore/antarctica/antarctica2015co2composite.txt"
    landing_page: "https://www.ncei.noaa.gov/access/paleo-search/study/17975"
    citation: "Bereiter et al. 2015, Geophys. Res. Lett. 42, doi:10.1002/2014GL061957"
    licence: >
      No explicit grant at archive; NCEI study 17975 metadata carries a
      citation-only use constraint, not a licence. NOT confirmed US
      Government work — the data are author-contributed (Bereiter,
      Eggleston, Schmitt, Nehrbass-Ahles, Stocker, Fischer of the
      University of Bern; Kipfstuhl, AWI; Chappellaz, CNRS), and NAO
      205-17A covers NOAA's own works, not archive-hosted contributed
      files (review finding #45).
    licence_note: >
      Evidence trail (review finding #45, re-verifying the Kaufman check
      in reviews/spike-04-chart-findings.md): NCEI study 17975's
      `dataLicenseDescription`/`dataLicenseUrl` are both null, identical
      to Kaufman study 29712 — same archive, same absence of a licence
      grant. The contributing authors are academic (Bern/AWI/CNRS), not
      NOAA staff, so the US-government public-domain rationale that
      covers GML/GISTEMP does not apply here either. Treat as
      open-with-attribution PROVISIONALLY; before the pack ships (#16),
      obtain written confirmation from the authors or NCEI — one letter
      can cover both this and the Kaufman study (see #16 plan). Until
      confirmed, never in the chart data pack and never captioned "public
      data" (review finding #45).
    attribution_text: "Bereiter et al. 2015; NOAA NCEI Paleoclimatology (WDS Paleo), study 17975"
    permitted_context: open-provisional
    in_chart_pack: false
    sha256: "de57b3967758725b9650717a71bd665ebc87e23d41d3d3ad05c9095a6e7e393f"
    time_axis: {unit: years_bp, present_ce: 1950}
    variable: {name: co2_ppm, unit: ppm}
    coverage: {oldest_bp: 805669, youngest_bp: -51}
    parser: charts/spike/parsers.py::parse_bereiter_co2
    human_signoff:
      who: "issue #5 implementer (per review finding #45 and reviews/spike-04-chart-findings.md)"
      date: "2026-08-16"
      note: >
        Reclassified open -> open-provisional per review finding #45's
        evidence (NCEI licence metadata null; author-contributed, non-US-
        government data). Pending a human licensing sign-off (DESIGN
        §2.2 step 3) and the written confirmation request before #16.

