# Chart data-pack manifest. Schema enforced by ingestion/manifest.py
# (issue #5) plus the pack-level fields charts/datasets.py additionally
# requires (issue #14): `parser` (resolved via charts.pack.resolve_parser
# — production parsers only, never spike code), `time_axis` and
# `coverage`. This file still carries the two curation-time scientific
# decisions that ADR-020 says live here, not in the LLM or the renderer:
#   * which dataset pairs may be spliced, and at which year;
#   * the legal rebaseline alignment period per pair.
#
# ADR-023 (no dataset files in git): sha256 values pin the exact bytes
# fetched from each origin URL on the date below; `make datasets` fetches,
# verifies and lands raw files in gitignored data/datasets/, never in the
# repo. Every dataset's four listed hashes were independently re-verified
# (refetched and re-hashed) on the access date below, not merely copied
# forward from the issue #4 spike.
#
# Pack invariant (DESIGN 2.1/3.7): only confirmed `permitted_context: open`
# datasets may have `in_chart_pack: true`. kaufman2020_temp12k and (per
# review finding #45) bereiter2015_co2 are `open-provisional` — their
# licence_note records the evidence trail; see
# reviews/spike-04-chart-findings.md for the full check and issue #23 for
# the pending written-confirmation request. noaa_gml_co2_mlo carries
# per-segment `provenance` (review finding #46): its 1959-1974 annual
# means derive from Scripps/Keeling measurements, not a US Government
# work, and the Scripps credit the source file requests is recorded and
# carried into attribution_text.
#
# human_signoff on every entry below records the review/implementation
# trail that established these licence facts — it is an autonomous-
# pipeline record per ORCHESTRATION.md, not an individual human's
# personal line-by-line confirmation of each archive's terms; DESIGN
# §2.2 step 3 still names a human sign-off as part of the licensing gate,
# so this should get a human look before these datasets are relied on for
# a release (flagged in the issue #5 PR and carried forward here).

